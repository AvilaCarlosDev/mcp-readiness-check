name: Reporte de error / Bug report
description: Algo no funciona como debería / Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: que-pasa
    attributes:
      label: Qué ocurre / What happens
      description: Describe el problema y lo que esperabas / Describe the problem and what you expected.
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo / Steps to reproduce
      description: Incluye el comando exacto, sin credenciales reales / Include the exact command, without real credentials.
    validations:
      required: true
  - type: input
    id: entorno
    attributes:
      label: Entorno / Environment
      description: Versión de mcp-readiness-check, de Node y sistema operativo / Tool version, Node version and OS.
      placeholder: "0.3.0, Node 22, Ubuntu 24.04"
    validations:
      required: true
  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad / Privacy
      options:
        - label: Revisé el reporte y no contiene claves, tokens ni configuración privada / I reviewed the report and it contains no keys, tokens or private configuration
          required: true
